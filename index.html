<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Plant Heroes: Blightfall - Tactical Grid Strategy</title>

    <!-- SVG favicon so the one file covers every size, including the 16px tab. The theme
         colour matches the app background, so mobile browser chrome stops flashing white
         around a game that is otherwise entirely dark. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Chiến thuật theo lượt trên lưới ô vuông: dẫn dắt biệt đội Plant Heroes chặn đứng Đạo Quân Xác Sống, bảo vệ những bộ não cuối cùng." />
    <meta name="color-scheme" content="dark" />
    <!-- Tailwind biên dịch lúc build (tailwind.config.js + index.css, nạp qua index.tsx).
         Đừng thêm lại script cdn.tailwindcss.com: đó là cả trình biên dịch chạy runtime,
         từng là nguồn giật lag chính trên điện thoại. -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- PWA Manifest & iOS Fullscreen Standalone Support -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blightfall" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="bg-itb-bg text-white overflow-hidden font-pixel">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg error:', err));
        });
      }
    </script>
  </body>
</html>
