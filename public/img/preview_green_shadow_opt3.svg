<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Rich 3D Metallic Background -->
    <radialGradient id="metalBg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- 3D Pea Shading Gradient -->
    <radialGradient id="pea3D" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>

    <!-- Gold Frame Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Outer Frame -->
  <polygon points="200,10 360,95 360,305 200,390 40,305 40,95" fill="url(#goldGrad)" />
  <polygon points="200,20 345,100 345,298 200,378 55,298 55,100" fill="url(#metalBg)" stroke="#facc15" stroke-width="2" />

  <!-- Glossy Overlay -->
  <path d="M 55 100 L 345 100 L 320 220 C 200 250, 100 220, 55 100 Z" fill="url(#gloss)" opacity="0.6" />

  <!-- Cape 3D Fold -->
  <path d="M 110 230 C 80 320, 320 320, 290 230 C 330 330, 70 330, 110 230 Z" fill="#1e3a8a" />

  <!-- 3D Peashooter Head -->
  <circle cx="200" cy="195" r="75" fill="url(#pea3D)" />
  <!-- Specular Light Reflection Spot -->
  <ellipse cx="175" cy="155" rx="18" ry="10" fill="#ffffff" opacity="0.4" transform="rotate(-20 175 155)" />

  <!-- 3D Cannon Mouth -->
  <path d="M 250 180 C 300 175, 315 185, 315 195 C 315 205, 300 215, 250 210 Z" fill="url(#pea3D)" />
  <ellipse cx="310" cy="195" rx="10" ry="15" fill="#047857" stroke="#34d399" stroke-width="2" />
  <ellipse cx="310" cy="195" rx="5" ry="9" fill="#022c22" />

  <!-- Sleek 3D Hero Mask -->
  <path d="M 140 155 Q 200 135 260 155 Q 275 185 260 210 Q 200 225 140 210 Q 125 185 140 155 Z" fill="#090d16" stroke="#fbbf24" stroke-width="3" />

  <!-- Glowing 3D Eyes -->
  <circle cx="175" cy="178" r="10" fill="#facc15" />
  <circle cx="177" cy="176" r="4" fill="#ffffff" />
  
  <circle cx="225" cy="178" r="10" fill="#facc15" />
  <circle cx="227" cy="176" r="4" fill="#ffffff" />

  <!-- Text Label Badge -->
  <polygon points="200,335 310,335 290,370 110,370 90,335" fill="#0f172a" stroke="#facc15" stroke-width="2" />
  <text x="200" y="358" font-family="sans-serif" font-size="14" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="2">OPTION 3: 3D STYLIZED</text>
</svg>
